services:
  haus_mqtt:
    container_name: haus_mqtt_local
    image: eclipse-mosquitto:latest
    ports:
      - "11883:1883"
      - "18883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  haus_web:
    container_name: haus_web_local
    build:
      context: .
      dockerfile: haus-dockerfile
      args:
        PUBLISH_DIR: publish/haus-web
        ENTRY_FILE: Haus.Web.Host.dll
        RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-Acceptance}
    ports:
      - "15000:80"
    environment:
      - "ASPNETCORE_URLS=http://+:80"
      - "Mqtt__Server=mqtt://haus_mqtt:1883"
      - "Database__ConnectionString=Data Source=/app/data/haus_acceptance.db;"
    volumes:
      - haus_web_local_data:/app/data
    depends_on:
      - haus_mqtt
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/80'"]
      interval: 5s
      timeout: 3s
      retries: 10

  haus_zigbee_simulator:
    container_name: haus_zigbee_simulator_local
    build:
      context: .
      dockerfile: haus-dockerfile
      args:
        PUBLISH_DIR: publish/haus-zigbee-simulator
        ENTRY_FILE: Haus.Zigbee.Simulator.dll
        RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-Acceptance}
    ports:
      - "15004:8080"
      - "4901:4901"
    environment:
      - "ASPNETCORE_URLS=http://+:8080"
      - "Simulator__TcpPort=4901"

  haus_zigbee:
    container_name: haus_zigbee_local
    build:
      context: .
      dockerfile: haus-dockerfile
      args:
        PUBLISH_DIR: publish/haus-zigbee
        ENTRY_FILE: Haus.Zigbee.Host.dll
        RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-Acceptance}
    environment:
      - "Haus__Server=mqtt://haus_mqtt:1883"
      - "Zigbee__TcpHost=haus_zigbee_simulator"
      - "Zigbee__TcpPort=4901"
    depends_on:
      - haus_mqtt
      - haus_zigbee_simulator

  haus_site:
    container_name: haus_site_local
    build:
      context: .
      dockerfile: haus-site-dockerfile
      args:
        PUBLISH_DIR: publish/haus-site
        RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-Acceptance}
    ports:
      - "15003:443"
    volumes:
      - ./cert.crt:/etc/nginx/certs/cert.crt
      - ./cert.key:/etc/nginx/certs/cert.key
    depends_on:
      - haus_web
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  haus_web_local_data:
