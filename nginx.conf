events { }

http {
  include mime.types;

    server {
        listen 80;
        return 301 https://$http_host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/cert.key;

        index index.html;

        location / {
            root /var/www/web;
            try_files $uri $uri/ /index.html =404;
        }
    }
}