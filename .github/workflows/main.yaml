name: Main
on:
  push:
    branches:
      - main
  pull_request: 
    types: [opened, synchronize, reopened]

jobs:
  continuous_integration:
    name: Continuous Integration
    runs-on: ubuntu-22.04
    env:
      IS_RELEASE: ${{ github.event.inputs.is_release || false }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      AUTH_AUDIENCE: ${{ secrets.AUTH_AUDIENCE }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_REPO: personal
      LOG_LEVEL: Information
    steps:
      - name: Clone
        uses: actions/checkout@v7
      
      - name: Setup Machine
        uses: ./.github/actions/setup-machine

      - name: Prepare Build
        run: make build

      - name: Run Unit Tests
        run: make test-unit

      - name: Run Acceptance Tests
        run: make test-acceptance

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: tests/Haus.Acceptance.Tests/bin/**/playwright/traces/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos
          path: tests/Haus.Acceptance.Tests/bin/**/playwright/videos/*.webm
          if-no-files-found: ignore
          retention-days: 7